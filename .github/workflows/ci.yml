name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant; cancel it rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-api:
    name: core-api (Go + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Postgres 17 on purpose, not 15 or 16: the budget table declares
        # UNIQUE NULLS NOT DISTINCT, which does not exist before 15 and is silently ignored
        # by older planners. Testing against an older server would pass while production
        # accumulated duplicate overall budgets.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_garden_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/core-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/core-api/go.mod
          cache-dependency-path: backend/core-api/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt (formatting is not a matter of opinion in CI)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: test
        # The store tests DELETE FROM every table on setup, which is why they point at a
        # throwaway service container and never at a real database.
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/expense_garden_test?sslmode=disable
        run: go test ./... -count=1

      - name: build the release binary the Dockerfile builds
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags="-s -w" ./cmd/api

  android:
    name: app (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.5.2 requires 17. The local machine's default java is 11, which is why every
          # Gradle command in the plans exports the Studio JBR; CI just installs 17 directly.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Instrumented tests are deliberately NOT run here. They need a booted emulator, take
      # minutes, and — per the plans — connectedDebugAndroidTest uninstalls the app when it
      # finishes. They stay a local gate, run against a real device before each phase closes.

      - name: upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: app/build/reports/tests/testDebugUnitTest/
